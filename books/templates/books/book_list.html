<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Book Library</title>
</head>

<body>

    <h1>My Book Library</h1>

    <p>Total books: {{ books|length }}</p>

    <p>
        <a href="{% url 'add_book' %}">+ Add a new book</a>
    </p>

    <table border="1" cellpadding="8">

        <tr>
            <th>No.</th>
            <th>Title</th>
            <th>Author</th>
            <th>Year</th>
            <th>Status</th>
        </tr>

        {% for book in books %}

        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.year_published }}</td>
            <td>{{ book.is_available|yesno:"Available,Issued" }}</td>
        </tr>

        {% empty %}

        <tr>
            <td colspan="5">No books yet.</td>
        </tr>

        {% endfor %}

    </table>

</body>

</html>
